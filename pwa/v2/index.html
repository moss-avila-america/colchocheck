<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923"><link rel="manifest" href="./manifest.webmanifest"><meta name="description" content="ColchoCheck V2: control de asistencia y cobertura">
<title>ColchoCheck V2 · Colchones América</title>
<style>
:root{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a2734;background:#f3f5f7;--dark:#111923;--line:#e2e7ed;--muted:#627386;--gold:#ecbd42;--good:#18724e;--bad:#bd3646}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border-radius:11px;padding:11px 14px;border:1px solid var(--line)}input,select,textarea{padding:12px 13px;border:1px solid #ced6df;border-radius:11px;background:#fff;color:#192737;width:100%;min-height:45px}textarea{resize:vertical}button:disabled{opacity:.55;cursor:wait}a{color:#1b5b91}small{color:var(--muted)}header{background:var(--dark);color:#fff}header .bar{max-width:1050px;margin:auto;min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px}header strong{font-size:24px;letter-spacing:-1px}header strong span{color:var(--gold)}header small{display:block;color:#bdc9d4;letter-spacing:.2px}header .version{font-size:11px;letter-spacing:.5px;white-space:nowrap;border:1px solid #697786;padding:6px 9px;border-radius:50px;color:#edf1f4}
main{max-width:1050px;margin:0 auto;padding:20px 18px 90px}.shell{max-width:490px;margin:30px auto}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 5px 24px #243b5208}.card h2,.card h3{margin:0 0 8px;letter-spacing:-.45px}.card p{margin:7px 0}.stack{display:grid;gap:14px}.primary{background:var(--dark);border:1px solid var(--dark);color:#fff;font-weight:730}.gold{background:var(--gold);border:1px solid var(--gold);color:#1b2631;font-weight:750}.light{background:#fff;border:1px solid #c8d2de;color:#253447;font-weight:650}.danger{background:#fff1f2;color:#9f2632;border-color:#e7bcc2}.full{width:100%}.mini{padding:7px 11px;font-size:13px}.badge{display:inline-block;background:#eef2f6;color:#536577;border-radius:7px;font-size:12px;padding:5px 8px}.badge.good{background:#e7f5ee;color:#17734f}.badge.goldish{background:#fff5d8;color:#86570b}
label{font-size:13px;font-weight:680;display:grid;gap:6px}.muted{color:var(--muted)}.sub{font-size:13px}.notice{background:#fff9e8;border:1px solid #f0daa0;padding:12px 15px;border-radius:12px;font-size:13px;line-height:1.55}.error{background:#fdecef;color:#a12638;border-color:#efc3cc}.success{background:#e9f7f0;border-color:#bbe2cc;color:#246b48}
.eyebrow{letter-spacing:1.1px;text-transform:uppercase;font-size:11px;font-weight:800;color:#8f732b}.heading{margin:0 0 3px;font-size:26px;letter-spacing:-.9px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}.top p{margin:3px 0 0;color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:7px}nav button{background:white;color:#506075;white-space:nowrap;border:1px solid var(--line);font-weight:650}nav button.active{background:var(--dark);color:white;border-color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat{font-size:29px;font-weight:830;letter-spacing:-1.1px;margin:8px 0 4px}.line{height:1px;background:#e9edf2;margin:15px 0}.hstack{display:flex;align-items:center;justify-content:space-between;gap:12px}.map{width:100%;height:190px;border:0;border-radius:11px;background:#e9eff2}.location{border:1px solid #d9e7eb;border-radius:13px;padding:13px;background:#f6fafb}.address{font-size:14px;font-weight:690;margin:8px 0}.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:#567082}.hint{font-size:12px;color:#617082;line-height:1.6}.photo-file{padding:12px;border:1px dashed #bac8d3;border-radius:11px;background:#f8fafb}.visit-row{padding:14px 0;border-bottom:1px solid #edf0f3}.visit-row:last-child{border:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fields .wide{grid-column:1/-1}#flash:empty{display:none}#flash{margin-bottom:13px}.privacy{font-size:12px;color:#66798a}.branding{margin-top:28px;text-align:center;color:#8b96a3;font-size:12px}@media(max-width:690px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.fields .wide{grid-column:auto}.card{padding:17px}.heading{font-size:23px}header strong{font-size:21px}.top{align-items:flex-start;flex-wrap:wrap}}
</style></head><body>
<header><div class="bar"><div><strong>Colcho<span>Check</span></strong><small>COLCHONES AMÉRICA · Asistencia & cobertura</small></div><div class="version">V2 · PILOTO</div></div></header>
<main><div id="flash" role="status" aria-live="polite"></div><div id="app"><div class="shell card">Preparando conexión segura…</div></div><div class="branding">ColchoCheck V2 · Proyecto independiente del sistema anterior</div></main>
<script type="module" src="./app.js"></script>
</body></html>
